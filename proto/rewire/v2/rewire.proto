syntax = "proto3";

package rewire.v2;

// Hosted by the rewire viewer. Clients: bridges (heartbeat + identity
// probe), CLI tools that need viewer-side state.
//
// Kept at its v0.5.0 surface. Relay hosts serve RelayService instead;
// once the viewer becomes a pure client (REW-41 Phase 3) this service is
// slated for removal in a lean v3.
service ViewerService {
  rpc GetInfo(GetInfoRequest) returns (GetInfoResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
}

// Hosted by `rewire serve` (standalone, or embedded in the bridge): the
// host/monitoring plane of the relay architecture, served on the same
// port as Rerun's MessageProxyService. Bridges report in via Heartbeat;
// viewers and CLI tools query host state.
service RelayService {
  rpc GetInfo(GetInfoRequest) returns (GetInfoResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  // Active recordings known to the relay, derived from bridge heartbeats.
  rpc ListRecordings(ListRecordingsRequest) returns (ListRecordingsResponse);
  // Read-side heartbeat query: per-bridge liveness as seen by the relay.
  rpc GetHeartbeats(GetHeartbeatsRequest) returns (GetHeartbeatsResponse);
}

// Hosted by `rewire record` (the bridge process) on a loopback gRPC
// endpoint. Clients: `rewire log`, `rewire doctor`, `rewire types`.
service BridgeService {
  rpc NewRecording(NewRecordingRequest) returns (NewRecordingResponse);
  rpc ListTopics(ListTopicsRequest) returns (ListTopicsResponse);
  rpc GetGraph(GetGraphRequest) returns (GetGraphResponse);
}

message GetInfoRequest {}

message GetInfoResponse {
  // Host identity: "rewire" for the viewer, "rewire-serve" for the relay.
  // (Field name predates RelayService; renaming waits for v3 — the name is
  // not on the wire.)
  string viewer = 1;
  string version = 2;
  // Seconds since the host process started serving.
  uint64 uptime_seconds = 3;
  // Bytes currently held by the host's message buffer, when known.
  optional uint64 memory_used_bytes = 4;
  // Configured buffer memory limit in bytes; absent when unlimited.
  optional uint64 memory_limit_bytes = 5;
}

enum BridgeState {
  BRIDGE_STATE_UNSPECIFIED = 0;
  BRIDGE_STATE_IDLE = 1;
  BRIDGE_STATE_ACTIVE = 2;
}

message HeartbeatRequest {
  string bridge_id = 1;
  BridgeState state = 2;
  optional string app_id = 3;
  optional string recording_id = 4;
}

message HeartbeatResponse {}

message ListRecordingsRequest {}

message ListRecordingsResponse {
  repeated RecordingEntry recordings = 1;
}

message RecordingEntry {
  string bridge_id = 1;
  string app_id = 2;
  string recording_id = 3;
  BridgeState state = 4;
  // Milliseconds since the last heartbeat from this bridge.
  uint64 last_seen_millis = 5;
}

message GetHeartbeatsRequest {}

message GetHeartbeatsResponse {
  repeated BridgeHeartbeat bridges = 1;
}

message BridgeHeartbeat {
  string bridge_id = 1;
  BridgeState state = 2;
  // Milliseconds since the last heartbeat from this bridge.
  uint64 last_seen_millis = 3;
}

message NewRecordingRequest {
  optional string app_id = 1;
  optional string recording_id = 2;
}

message NewRecordingResponse {
  string recording_id = 1;
}

message ListTopicsRequest {}

message ListTopicsResponse {
  repeated TopicEntry topics = 1;
}

message TopicEntry {
  string name = 1;
  string type_name = 2;
  repeated string transports = 3;
}

message GetGraphRequest {}

message GetGraphResponse {
  repeated GraphNode nodes = 1;
  repeated GraphTopic topics = 2;
  repeated GraphService services = 3;
}

message GraphNode {
  string name = 1;
  optional string transport = 2;
}

message GraphTopic {
  string name = 1;
  string type_name = 2;
  repeated string publishers = 3;
  repeated string subscribers = 4;
  repeated string transports = 5;
  bool has_writers = 6;
}

message GraphService {
  string name = 1;
  string type_name = 2;
}
